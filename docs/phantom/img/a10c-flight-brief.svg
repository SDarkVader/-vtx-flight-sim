<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">VTX Phantom A10-C Flight Test</title>
<desc id="desc">A dark technical flight-test graphic showing an observed 1456.98 metre clearance, a 79 metre-per-second scripted fans-off takeoff, and a November 12 2026 manual flying campaign.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121d"/><stop offset=".6" stop-color="#101d2b"/><stop offset="1" stop-color="#070d15"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e7a53c"/><stop offset=".5" stop-color="#ffe0a0"/><stop offset="1" stop-color="#c37b1d"/></linearGradient>
<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a3455"/><stop offset=".72" stop-color="#3bd8ff"/><stop offset="1" stop-color="#a6f0ff"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6ca7b9" stroke-opacity=".075" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="390" rx="16" fill="url(#bg)"/>
<rect width="1200" height="390" rx="16" fill="url(#grid)"/>
<path d="M25 18H1174" stroke="url(#accent)" stroke-width="3"/>
<path d="M0 310 335 310 450 252 620 252" stroke="#5bcbe5" stroke-opacity=".3" stroke-width="2" fill="none"/>
<path d="M0 329 344 329 457 272 620 272" stroke="#5bcbe5" stroke-opacity=".15" stroke-width="2" fill="none"/>
<path d="M1030 27 1180 27 1180 166" stroke="url(#cyan)" stroke-width="2" fill="none" opacity=".6"/>
<circle cx="1060" cy="125" r="71" fill="none" stroke="#3bd8ff" stroke-width="2" opacity=".2"/>
<circle cx="1060" cy="125" r="48" fill="none" stroke="#e7a53c" stroke-width="2" opacity=".28"/>
<path d="m999 125h123m-62-61v122" stroke="#3bd8ff" stroke-opacity=".35" stroke-width="1"/>
<path d="M1016 149 1060 84 1102 149 1060 133Z" fill="#e5ad54" opacity=".82"/>
<path d="m1037 155 23-41 23 41" stroke="#90e6ff" stroke-width="3" fill="none"/>
<text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="5" fill="#eab55c" font-weight="700">VADER'S TAXIS  /  FLIGHT TEST PROGRAM</text>
<text x="44" y="151" font-family="Arial,Helvetica,sans-serif" font-size="74" letter-spacing="1" fill="#f4f7fb" font-weight="800">PHANTOM</text>
<text x="49" y="206" font-family="Arial,Helvetica,sans-serif" font-size="49" letter-spacing="10" fill="url(#accent)" font-weight="700">A10-C</text>
<text x="49" y="252" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#acbfcc">RUNWAY TAKEOFF  •  MANUAL FLIGHT  •  RECORDED IMPACTS</text>
<path d="M48 292H1152" stroke="#638095" stroke-opacity=".55" stroke-width="1"/>
<text x="50" y="333" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#fcffff" font-weight="700">1,456.98 m</text>
<text x="51" y="355" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.5" fill="#91aebe">OBSERVED SCREENSHOT CLEARANCE</text>
