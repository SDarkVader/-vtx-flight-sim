<text x="850" y="333" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#fcffff" font-weight="700">12 NOV 2026</text>
<text x="850" y="355" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.5" fill="#91aebe">OPERATOR FLIGHT CAPTURES</text>
