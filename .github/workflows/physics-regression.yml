name: VTX mathematical regressions (uncalibrated)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic visual routes and standalone ride terrain
        run: node tests/visual-air-traffic.test.mjs
      - name: Assert algebra, trajectory and calibration gate
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Produce labelled reference-only outputs
        env:
          PYTHONPATH: src
        run: python scripts/run_reference.py --out results
      - uses: actions/upload-artifact@v4
        with:
          name: vtx-reference-only-results
          path: results/
          if-no-files-found: error

  previews:
    name: Publish verified Vercel previews
    needs: mathematics
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: vercel-preview-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the current branch and any open pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/preview_gate.py
      - name: Create previews of the tested commit
        if: steps.gate.outputs.publish == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 .github/scripts/vercel_previews.py
